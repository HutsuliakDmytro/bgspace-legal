# Пошук секретів у кожному PR і пуші в main.
# Демо-креди для рев'ю Apple тримаємо лише в App Store Connect
# (App Review Information), НЕ в цьому репо: воно публічне й віддає сайт.
name: gitleaks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
